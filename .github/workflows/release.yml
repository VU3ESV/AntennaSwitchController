name: Release

# Produces a GitHub Release with the macOS app (.zip), the ESP8266 firmware (.bin), and
# the Amateur Radio Suite plugin (.radioplugin). Triggered three ways:
#   1. PR merged into main  -> auto-bump the latest vX.Y.Z tag (patch) and release.
#   2. Push a vX.Y.Z tag    -> release that tag.
#   3. workflow_dispatch     -> release the given tag (created on main if absent).

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0). Created on the current commit if it doesn't exist."
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.bareRepository
  GIT_CONFIG_VALUE_0: all

jobs:
  # Resolve the release version up front so the macOS app can be stamped with it
  # at build time. The app and publish jobs both consume these outputs, so the
  # bundle's CFBundleShortVersionString always matches the published tag.
  version:
    name: Resolve version + tag
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      value: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0      # full tags for auto-bump

      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            # PR merged into main — auto-bump the latest clean semver tag (patch).
            git fetch --tags --force --quiet
            LATEST="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
            if [ -z "$LATEST" ]; then
              TAG="v0.1.0"
            else
              IFS=. read -r MA MI PA <<< "${LATEST#v}"
              TAG="v${MA}.${MI}.$((PA + 1))"
            fi
            while git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; do
              IFS=. read -r MA MI PA <<< "${TAG#v}"
              TAG="v${MA}.${MI}.$((PA + 1))"
            done
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

  firmware:
    name: Build ESP8266 firmware
    # Only on a real merge (or tag/dispatch) — a closed-but-unmerged PR must not release.
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 core + WebSockets
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266
          arduino-cli lib install WebSockets

      - name: Compile firmware (.bin)
        run: |
          arduino-cli compile \
            --fqbn esp8266:esp8266:generic:eesz=4M1M \
            --output-dir fw \
            Controller
          cp fw/Controller.ino.bin AntennaSwitchController-firmware.bin
          ls -la AntennaSwitchController-firmware.bin

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: AntennaSwitchController-firmware.bin
          if-no-files-found: error

  app:
    name: Build macOS app (universal) + plugin
    needs: version
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal release .app
        working-directory: App
        env:
          UNIVERSAL: "1"
          VERSION: ${{ needs.version.outputs.value }}
        run: ./build-app.sh

      - name: Verify universal binary
        working-directory: App
        run: lipo -archs "dist/Antenna Switch Controller.app/Contents/MacOS/AntennaSwitchControllerApp"

      - name: Build plugin package (.appex / .radioplugin)
        working-directory: App
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          ./scripts/make-radioplugin.sh        # -> App/dist/AntennaSwitch.radioplugin

      - name: Package app as .dmg
        working-directory: App
        run: ./scripts/make-dmg.sh        # -> App/dist/Antenna-Switch-Controller-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          # the app .dmg + the plugin (an ADDITIONAL artifact alongside the app)
          path: |
            App/dist/Antenna-Switch-Controller-macOS.dmg
            App/dist/AntennaSwitch.radioplugin
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [ version, firmware, app ]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: main
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/macos-app/Antenna-Switch-Controller-macOS.dmg
            artifacts/macos-app/AntennaSwitch.radioplugin
            artifacts/firmware/AntennaSwitchController-firmware.bin
          body: |
            **Antenna Switch Controller** release — macOS app + ESP8266 firmware + Suite plugin.

            ## macOS app (`Antenna-Switch-Controller-macOS.dmg`)
            Universal binary (Apple Silicon + Intel).

            > ⚠️ **Unsigned & not notarized.** macOS Gatekeeper will block it on
            > another Mac until you clear the quarantine flag.

            1. Open the DMG and drag **Antenna Switch Controller.app** to `/Applications`.
            2. Clear the quarantine attribute (one time):
               ```bash
               xattr -dr com.apple.quarantine "/Applications/Antenna Switch Controller.app"
               ```
            3. Launch it (first time: right-click → **Open**). Allow **Local
               Network** access so discovery and controller communication work.

            ## Suite plugin (`AntennaSwitch.radioplugin`)
            Install via the [Amateur Radio Suite](https://github.com/VU3ESV/AmateurRadioSuite)
            (*Manage Plugins → Install from File*) to run the controller out-of-process.

            ## Firmware (`AntennaSwitchController-firmware.bin`)
            For the ESP8266 ESP-12F 8-channel relay board (built with
            `eesz=4M1M`).

            - **Over-the-air** (board already on the LAN):
              ```bash
              espota.py -i <board-ip> -p 8266 -f AntennaSwitchController-firmware.bin -r
              ```
              (`espota.py` ships with the ESP8266 Arduino core under
              `tools/`. No OTA password is set by default.)
            - **USB** (board in flash mode): flash the `.bin` at offset `0x0` with
              `esptool.py`, or rebuild from `Controller/` with `arduino-cli`.
