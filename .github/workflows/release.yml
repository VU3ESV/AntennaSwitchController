name: Release

# Produces a GitHub Release with the macOS app (.zip), the ESP8266 firmware (.bin), and
# the Amateur Radio Suite plugin (.radioplugin). Triggered three ways:
#   1. PR merged into main  -> auto-bump the latest vX.Y.Z tag (patch) and release.
#   2. Push a vX.Y.Z tag    -> release that tag.
#   3. workflow_dispatch     -> release the given tag (created on main if absent).

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0). Created on the current commit if it doesn't exist."
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.bareRepository
  GIT_CONFIG_VALUE_0: all

jobs:
  # Skip the whole release when a merged PR / pushed change only touches documentation.
  # Tag pushes and manual dispatch always release. Downstream jobs need `version`, so
  # gating it here cascades the skip to firmware/app/publish.
  gate:
    name: Decide whether to release (skip docs-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ev="${{ github.event_name }}"
          # Explicit releases are never skipped.
          if [ "$ev" = "workflow_dispatch" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$ev" = "push" ]; then
            case "${{ github.ref }}" in
              refs/tags/*) echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
            files="$(gh api --paginate "repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.event.after }}" -q '.files[].filename' || true)"
          elif [ "$ev" = "pull_request" ]; then
            files="$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" -q '.[].filename' || true)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Changed files:"; printf '  %s\n' "$files"
          # Docs-only when EVERY changed file is markdown, under docs/, or LICENSE.
          skip=true
          [ -z "$files" ] && skip=false   # unknown/empty diff -> release, don't skip
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|docs/*|*/docs/*|LICENSE) : ;;
              *) skip=false; break ;;
            esac
          done <<< "$files"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = true ]; then echo "::notice::Docs-only change — skipping release."; fi

  # Resolve the release version up front so the macOS app can be stamped with it
  # at build time. The app and publish jobs both consume these outputs, so the
  # bundle's CFBundleShortVersionString always matches the published tag.
  version:
    needs: gate
    name: Resolve version + tag
    if: (github.event_name != 'pull_request' || github.event.pull_request.merged == true) && needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      value: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0      # full tags for auto-bump

      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            # PR merged into main — auto-bump the latest clean semver tag (patch).
            git fetch --tags --force --quiet
            LATEST="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
            if [ -z "$LATEST" ]; then
              TAG="v0.1.0"
            else
              IFS=. read -r MA MI PA <<< "${LATEST#v}"
              TAG="v${MA}.${MI}.$((PA + 1))"
            fi
            while git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; do
              IFS=. read -r MA MI PA <<< "${TAG#v}"
              TAG="v${MA}.${MI}.$((PA + 1))"
            done
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

  firmware:
    name: Build ESP8266 firmware
    needs: version            # stamp the release version into FW_VERSION
    # Only on a real merge (or tag/dispatch) — a closed-but-unmerged PR must not release.
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 core + WebSockets
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266
          arduino-cli lib install WebSockets

      - name: Compile firmware (.bin)
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          # Inject the release version so /discover (and the mDNS TXT) report the
          # real version instead of the hardcoded "1.0" fallback in WebPortal.h.
          arduino-cli compile \
            --fqbn esp8266:esp8266:generic:eesz=4M1M \
            --build-property "compiler.cpp.extra_flags=-DFW_VERSION=\"${VERSION}\"" \
            --output-dir fw \
            Controller
          cp fw/Controller.ino.bin AntennaSwitchController-firmware.bin
          ls -la AntennaSwitchController-firmware.bin

      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: AntennaSwitchController-firmware.bin
          if-no-files-found: error

  app:
    name: Build macOS app (universal) + plugin
    needs: version
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Build signed + notarized DMG (app with embedded extension)
        working-directory: App
        env:
          UNIVERSAL: "1"
          VERSION: ${{ needs.version.outputs.value }}
          # Signing/notarization secrets (see docs/SIGNING-SECRETS.md). When unset, the script
          # falls back to ad-hoc and skips notarization — the build still succeeds, but the
          # released app's extension will not register on other Macs.
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          ./scripts/package-signed.sh        # -> App/dist/Antenna-Switch-Controller-macOS.dmg

      - name: Verify universal binary
        working-directory: App
        run: lipo -archs "dist/Antenna Switch Controller.app/Contents/MacOS/AntennaSwitchControllerApp"

      - name: Build plugin package (.appex / .radioplugin)
        working-directory: App
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          ./scripts/make-radioplugin.sh        # -> App/dist/AntennaSwitch.radioplugin

      - uses: actions/upload-artifact@v7
        with:
          name: macos-app
          # the app .dmg + the plugin (an ADDITIONAL artifact alongside the app)
          path: |
            App/dist/Antenna-Switch-Controller-macOS.dmg
            App/dist/AntennaSwitch.radioplugin
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [ version, firmware, app ]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Compose release notes
        env:
          # 'true' only when the macOS app signing + notary secrets are present (notarized build).
          NOTARIZED: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.NOTARY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          {
            echo "**Antenna Switch Controller** release — macOS app + ESP8266 firmware + Suite plugin."
            echo
            echo "## macOS app (\`Antenna-Switch-Controller-macOS.dmg\`)"
            echo "Universal binary (Apple Silicon + Intel)."
            echo
            if [ "${NOTARIZED}" = "true" ]; then
              echo "Signed with Developer ID and **Apple-notarized** — no Gatekeeper bypass needed."
              echo
              echo "1. Open the DMG and drag **Antenna Switch Controller.app** to \`/Applications\`."
              echo "2. Launch it. Allow **Local Network** access so discovery and controller communication work."
            else
              echo "> ⚠️ **Unsigned & not notarized.** macOS Gatekeeper will block it on another Mac until you clear the quarantine flag."
              echo
              echo "1. Open the DMG and drag **Antenna Switch Controller.app** to \`/Applications\`."
              echo "2. Clear the quarantine attribute (one time):"
              echo "   \`\`\`bash"
              echo "   xattr -dr com.apple.quarantine \"/Applications/Antenna Switch Controller.app\""
              echo "   \`\`\`"
              echo "3. Launch it (first time: right-click → **Open**). Allow **Local Network** access so discovery and controller communication work."
            fi
            echo
            echo "## Suite plugin (\`AntennaSwitch.radioplugin\`)"
            echo "Install via the [Amateur Radio Suite](https://github.com/VU3ESV/AmateurRadioSuite) (*Manage Plugins → Install from File*) to run the controller out-of-process."
            echo
            echo "## Firmware (\`AntennaSwitchController-firmware.bin\`)"
            echo "For the ESP8266 ESP-12F 8-channel relay board (built with \`eesz=4M1M\`)."
            echo
            echo "- **Over-the-air** (board already on the LAN):"
            echo "  \`\`\`bash"
            echo "  espota.py -i <board-ip> -p 8266 -f AntennaSwitchController-firmware.bin -r"
            echo "  \`\`\`"
            echo "  (\`espota.py\` ships with the ESP8266 Arduino core under \`tools/\`. No OTA password is set by default.)"
            echo "- **USB** (board in flash mode): flash the \`.bin\` at offset \`0x0\` with \`esptool.py\`, or rebuild from \`Controller/\` with \`arduino-cli\`."
          } > RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: main
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/macos-app/Antenna-Switch-Controller-macOS.dmg
            artifacts/macos-app/AntennaSwitch.radioplugin
            artifacts/firmware/AntennaSwitchController-firmware.bin
          body_path: RELEASE_NOTES.md
