name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0). Created on the current commit if it doesn't exist."
        required: true

permissions:
  contents: write

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.bareRepository
  GIT_CONFIG_VALUE_0: all

jobs:
  firmware:
    name: Build ESP8266 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 core + WebSockets
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266
          arduino-cli lib install WebSockets

      - name: Compile firmware (.bin)
        run: |
          arduino-cli compile \
            --fqbn esp8266:esp8266:generic:eesz=4M1M \
            --output-dir fw \
            Controller
          cp fw/Controller.ino.bin AntennaSwitchController-firmware.bin
          ls -la AntennaSwitchController-firmware.bin

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: AntennaSwitchController-firmware.bin
          if-no-files-found: error

  app:
    name: Build macOS app (universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal release .app
        working-directory: App
        env:
          UNIVERSAL: "1"
        run: ./build-app.sh

      - name: Verify universal binary
        working-directory: App
        run: lipo -archs "dist/Antenna Switch Controller.app/Contents/MacOS/AntennaSwitchControllerApp"

      - name: Package (zip preserving the bundle)
        working-directory: App/dist
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "Antenna Switch Controller.app" \
            "Antenna-Switch-Controller-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: App/dist/Antenna-Switch-Controller-macOS.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [ firmware, app ]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/macos-app/Antenna-Switch-Controller-macOS.zip
            artifacts/firmware/AntennaSwitchController-firmware.bin
          body: |
            **Antenna Switch Controller** release — macOS app + ESP8266 firmware.

            ## macOS app (`Antenna-Switch-Controller-macOS.zip`)
            Universal binary (Apple Silicon + Intel).

            > ⚠️ **Unsigned & not notarized.** macOS Gatekeeper will block it on
            > another Mac until you clear the quarantine flag.

            1. Unzip and move **Antenna Switch Controller.app** to `/Applications`.
            2. Clear the quarantine attribute (one time):
               ```bash
               xattr -dr com.apple.quarantine "/Applications/Antenna Switch Controller.app"
               ```
            3. Launch it (first time: right-click → **Open**). Allow **Local
               Network** access so discovery and controller communication work.

            ## Firmware (`AntennaSwitchController-firmware.bin`)
            For the ESP8266 ESP-12F 8-channel relay board (built with
            `eesz=4M1M`).

            - **Over-the-air** (board already on the LAN):
              ```bash
              espota.py -i <board-ip> -p 8266 -f AntennaSwitchController-firmware.bin -r
              ```
              (`espota.py` ships with the ESP8266 Arduino core under
              `tools/`. No OTA password is set by default.)
            - **USB** (board in flash mode): flash the `.bin` at offset `0x0` with
              `esptool.py`, or rebuild from `Controller/` with `arduino-cli`.
